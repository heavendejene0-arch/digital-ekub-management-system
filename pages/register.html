
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Digital Ekub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main class="register-page">

        <div class="register-top">
            <a href="../index.html" class="register-brand">
                <span class="brand-icon">E</span>
                <span>DIGITAL <strong>EKUB</strong></span>
            </a>

            <p>Already have an account?
                <a href="../index.html">Sign in</a>
            </p>
        </div>

        <section class="register-card">

            <div class="register-heading">
                <p class="welcome-label">JOIN YOUR FINANCIAL COMMUNITY</p>
                <h1>Create your account.</h1>
                <p>Start saving smarter with your community.</p>
            </div>

            <form id="registerForm">

                <div class="register-grid">

                    <div class="form-group">
                        <label for="fullName">Full name</label>
                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="+251 9XXXXXXXX"
                            required
                        >
                    </div>

                    <div class="form-group full-width">
                        <label for="registerEmail">Email address</label>
                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="you@example.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <div class="password-field">
                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create a password"
                                minlength="8"
                                required
                            >
                            <button type="button" id="toggleRegisterPassword">
                                Show
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <div class="password-field">
                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Repeat your password"
                                required
                            >
                            <button type="button" id="toggleConfirmPassword">
                                Show
                            </button>
                        </div>
                    </div>

                </div>

                <label class="terms-label">
                    <input type="checkbox" id="agreeTerms" required>
                    <span>
                        I agree to the
                        <a href="#" id="termsLink">Terms and Conditions</a>
                        and Privacy Policy.
                    </span>
                </label>

                <button type="submit" class="login-button register-button">
                    Create account <span>→</span>
                </button>

                <p id="registerMessage" class="message" role="status"></p>

            </form>

            <div class="register-bottom">
                <span>✦</span> Secure community savings starts here.
            </div>

        </section>

        <footer class="register-footer">
            © 2026 Digital Ekub. All rights reserved.
        </footer>

    </main>

    <script src="../js/main.js"></script>
</body>
</html>
